<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<title>Mare Leborgne — touch icon source</title>
<!--
  Source for apple-touch-icon.png (180×180), used by iOS when the site is added
  to a home screen and by older Safari, neither of which reads the inline SVG
  favicon in index.html. Same two contour lines, same navy.

  To rebuild:

  "C:\Program Files\Google\Chrome\Application\chrome.exe" \
    --headless --disable-gpu --hide-scrollbars \
    --window-size=180,180 --force-device-scale-factor=1 \
    --screenshot=apple-touch-icon.png icon-card.html
-->
<style>
  *{margin:0;padding:0;}
  html,body{width:180px;height:180px;overflow:hidden;background:#0B1424;}
  svg{display:block;width:180px;height:180px;}
</style>
</head>
<body>
<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <rect width="32" height="32" fill="#0B1424"/>
  <g fill="none" stroke="#B8935A" stroke-linecap="round">
    <path d="M4 12.5c4-4.5 8-4.5 12 0s8 4.5 12 0" stroke-width="2.6"/>
    <path d="M4 21c4-4.5 8-4.5 12 0s8 4.5 12 0" stroke-width="1.8" stroke-opacity=".55"/>
  </g>
</svg>
</body>
</html>
