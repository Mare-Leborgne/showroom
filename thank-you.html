<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank you · Mare Leborgne</title>
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#0B1424">
<meta name="color-scheme" content="light">
<!--
  Where the form service returns a visitor after a successful submission.

  Only reached with JavaScript switched off: with it on, the enquiry is sent in
  the background and index.html never navigates away. Without this page they
  would land on the service's own generic success screen, which is the one
  moment in the whole visit where an unbranded page would be noticed.

  Deliberately plain — no canvas, no reveals, no cursor. One thing has just
  happened and the page should say so and stop.
-->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230B1424'/%3E%3Cg fill='none' stroke='%23B8935A' stroke-linecap='round'%3E%3Cpath d='M4 12.5c4-4.5 8-4.5 12 0s8 4.5 12 0' stroke-width='2.6'/%3E%3Cpath d='M4 21c4-4.5 8-4.5 12 0s8 4.5 12 0' stroke-width='1.8' stroke-opacity='.55'/%3E%3C/g%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Jost:wght@400&display=swap" rel="stylesheet">

<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --navy-deep:#0B1424;
    --ivory:#F3ECDD;
    --brass:#B8935A;
    --brass-ink:#7E5E33;
    --ink:#1a1a1a;
    --muted:#6b6255;
  }
  html{-webkit-text-size-adjust:100%;}
  body{
    min-height:100vh;min-height:100svh;
    background:var(--ivory);color:var(--ink);
    font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;
    display:flex;align-items:center;justify-content:center;
    padding:40px 24px;text-align:center;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:520px;}
  .mark{
    display:block;width:42px;height:30px;margin:0 auto 34px;
  }
  .label{
    font-family:'Jost',sans-serif;font-weight:400;
    letter-spacing:.24em;text-transform:uppercase;font-size:11px;
    color:var(--brass-ink);
  }
  h1{
    font-weight:300;font-size:clamp(30px,6vw,42px);line-height:1.25;
    letter-spacing:.005em;margin:22px 0 0;
  }
  .rule{width:54px;height:1px;background:var(--brass);opacity:.6;margin:30px auto;}
  p{
    font-style:italic;font-weight:300;font-size:19px;line-height:1.65;
    color:var(--muted);
  }
  .back{
    display:inline-block;margin-top:38px;
    font-family:'Jost',sans-serif;font-style:normal;
    font-size:12px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--navy-deep);text-decoration:none;
    border-bottom:1px solid rgba(126,94,51,.45);padding-bottom:5px;
    transition:border-color .4s cubic-bezier(.22,.61,.36,1);
  }
  .back:hover{border-color:var(--brass-ink);}
  .back:focus-visible{outline:2px solid var(--brass-ink);outline-offset:4px;border-radius:1px;}
</style>
</head>
<body>

<main class="wrap">
  <!-- the same two contour lines as the favicon and the hero's sea, in ink
       brass so they hold their weight against ivory instead of navy -->
  <svg class="mark" viewBox="4 8 24 17" aria-hidden="true">
    <g fill="none" stroke="#7E5E33" stroke-linecap="round">
      <path d="M4 12.5c4-4.5 8-4.5 12 0s8 4.5 12 0" stroke-width="2"/>
      <path d="M4 21c4-4.5 8-4.5 12 0s8 4.5 12 0" stroke-width="1.4" stroke-opacity=".55"/>
    </g>
  </svg>

  <span class="label">Received</span>
  <h1>Thank you.</h1>
  <div class="rule"></div>
  <p>Your enquiry is with the studio. You will have a reply within a few days, from a person who has read it properly.</p>

  <a class="back" href="/">Back to Mare Leborgne</a>
</main>

</body>
</html>
