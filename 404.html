  The page GitHub Pages serves for any address on this domain that does not
  exist. It has to be called 404.html and it has to sit at the root; that is
  the whole configuration.

  Without it a mistyped link, a stale bookmark or an old share lands a visitor
  on GitHub's own grey error page, complete with GitHub's logo — a studio
  arguing that a website is a business's showroom cannot afford to hand a
  visitor somebody else's front door at the one moment something has gone wrong.

  Built from thank-you.html so the two failure-and-confirmation pages are the
  same page in two moods: same face, same rule, same way back. Deliberately
  plain — no canvas, no reveals, no cursor.
